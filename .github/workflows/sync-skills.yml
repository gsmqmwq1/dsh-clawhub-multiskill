name: ClawHub & Agent Skills 72h Auto-Sync

on:
  schedule:
    # 每 72 小时 (3 天) 自动巡检一次
    - cron: '0 3 */3 * *'
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: '是否强制全量重审并拉取所有 214 个技能'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-skills:
    name: Sync ClawHub Upstream & Audit 800 Token Budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 72h Upstream Sync & Token Gate Audit
        run: |
          python scripts/sync_skills.py --sync --audit

      - name: Rebuild Client Bundles
        run: |
          if [ -f "build.py" ]; then
            python build.py
          fi

      - name: Commit & Create Pull Request on Changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(skills): auto-sync upstream skills (72h cycle)'
          title: '🔄 [72h Auto-Sync] ClawHub Upstream Skills & 800-Token Budget Audit'
          body: |
            ## 🤖 72h Automated Skills Ecosystem Sync Report
            
            This automated PR was generated by the 72-hour GitHub Action robot.
            
            ### Audit Checklist
            - [x] Standard: Complies with `SKILL_SELECTION_STANDARD.md`
            - [x] Star Gate: Authentic Agent Prompts with >= 1000 Stars
            - [x] Uniqueness: 100% distinct GitHub repositories (no repetitive fragmentation)
            - [x] Token Budget: Strictly gated <= 800 tokens (<4.5KB) to protect DeepSeek context window
            - [x] Bundle Rebuilt: `client.js` and `src/client.js` up to date
            - [x] Rollback Guarantee: Existing installed skills preserve `.bak` before user-triggered upgrades
          branch: auto-sync-clawhub
          delete-branch: true
